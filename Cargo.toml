[package]
name = "auth-spray-watch"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "Detect password-spraying and distributed brute-force activity in authentication logs."
license = "MIT"
repository = "https://github.com/httpEduardo/auth-spray-watch"
readme = "README.md"
keywords = ["security", "password-spray", "logs", "detection", "blue-team"]
categories = ["command-line-utilities"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
strip = true
